<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<title>Tweller Launcher</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Title bar ── */
  .titlebar {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .titlebar-logo { font-size: 22px; }
  .titlebar-name { font-size: 15px; font-weight: 700; letter-spacing: .5px; color: #f1f5f9; }
  .titlebar-sub  { font-size: 11px; color: #64748b; margin-left: 2px; }

  .status-pill {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    transition: all .3s;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #475569;
    transition: background .3s;
    flex-shrink: 0;
  }
  .status-pill.running .status-dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
  .status-pill.running { border-color: #10b981; color: #10b981; }
  .status-pill.stopped { color: #64748b; }

  /* ── Main layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    background: #1e293b;
    border-right: 1px solid #334155;
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .sidebar-section {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #475569;
    text-transform: uppercase;
    padding: 8px 8px 4px;
  }

  .btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s;
    text-align: left;
  }
  .btn:hover:not(:disabled)  { background: #334155; color: #e2e8f0; }
  .btn:active:not(:disabled) { background: #3f536a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn .icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

  .btn-start { color: #86efac; }
  .btn-start:hover:not(:disabled) { background: #14532d44; color: #4ade80; }
  .btn-stop  { color: #fca5a5; }
  .btn-stop:hover:not(:disabled)  { background: #7f1d1d44; color: #f87171; }
  .btn-primary { color: #a5b4fc; }
  .btn-primary:hover:not(:disabled) { background: #312e8144; color: #818cf8; }

  .divider {
    border: none;
    border-top: 1px solid #334155;
    margin: 6px 0;
  }

  /* ── Content ── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 20px;
    gap: 16px;
  }

  /* ── Info cards ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    flex-shrink: 0;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .card-value { font-size: 13px; color: #e2e8f0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Log ── */
  .log-wrap {
    flex: 1;
    background: #020617;
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .log-header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 8px 14px;
    font-size: 11px;
    color: #64748b;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .log-clear {
    background: none; border: none;
    color: #475569; font-size: 11px;
    cursor: pointer; padding: 0;
  }
  .log-clear:hover { color: #94a3b8; }

  .log-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.7;
    scroll-behavior: smooth;
  }
  .log-body::-webkit-scrollbar { width: 5px; }
  .log-body::-webkit-scrollbar-track { background: transparent; }
  .log-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

  .log-line { display: flex; gap: 10px; }
  .log-time  { color: #475569; flex-shrink: 0; }
  .log-msg.info    { color: #94a3b8; }
  .log-msg.success { color: #4ade80; }
  .log-msg.warn    { color: #fbbf24; }
  .log-msg.error   { color: #f87171; }
  .log-empty { color: #334155; font-style: italic; padding: 20px 0; }
</style>
</head>
<body>

<!-- Title bar -->
<div class="titlebar">
  <span class="titlebar-logo">📷</span>
  <div>
    <div class="titlebar-name">Tweller Launcher</div>
    <div class="titlebar-sub">Studio Control Panel</div>
  </div>
  <div class="status-pill stopped" id="status-pill">
    <span class="status-dot"></span>
    <span id="status-text">Watcher Stopped</span>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">Watcher</div>
    <button class="btn btn-start" id="btn-start" onclick="startWatcher()">
      <span class="icon">▶</span> Start Watcher
    </button>
    <button class="btn btn-stop" id="btn-stop" onclick="stopWatcher()" disabled>
      <span class="icon">■</span> Stop Watcher
    </button>

    <hr class="divider">
    <div class="sidebar-section">Git</div>
    <button class="btn btn-primary" id="btn-pull" onclick="gitPull()">
      <span class="icon">⬇</span> Git Pull
    </button>

    <hr class="divider">
    <div class="sidebar-section">Plugin</div>
    <button class="btn btn-primary" id="btn-zip" onclick="buildZip()">
      <span class="icon">📦</span> Build ZIP
    </button>
    <button class="btn" onclick="api.openWpAdmin()">
      <span class="icon">🌐</span> WP Galleries
    </button>

    <hr class="divider">
    <div class="sidebar-section">Folders</div>
    <button class="btn" onclick="api.openFolder('repo')">
      <span class="icon">📁</span> Repo Root
    </button>
    <button class="btn" onclick="api.openFolder('exports')">
      <span class="icon">🖼</span> Exports Folder
    </button>
  </aside>

  <!-- Content -->
  <main class="content">

    <!-- Info cards -->
    <div class="cards">
      <div class="card">
        <div class="card-label">Watch Directory</div>
        <div class="card-value" id="card-watch">—</div>
      </div>
      <div class="card">
        <div class="card-label">Exports Directory</div>
        <div class="card-value" id="card-exports">—</div>
      </div>
      <div class="card">
        <div class="card-label">WordPress URL</div>
        <div class="card-value" id="card-wp">—</div>
      </div>
    </div>

    <!-- Log -->
    <div class="log-wrap">
      <div class="log-header">
        Live Log
        <button class="log-clear" onclick="clearLog()">Clear</button>
      </div>
      <div class="log-body" id="log">
        <div class="log-empty">Waiting for activity…</div>
      </div>
    </div>

  </main>
</div>

<script>
  let logEmpty = true;

  // ── Init ──────────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    const { watcherRunning, config } = await api.getStatus();
    setWatcherUI(watcherRunning);
    document.getElementById('card-watch').textContent   = config.watchDir   || '—';
    document.getElementById('card-exports').textContent = config.exportsDir || '—';
    document.getElementById('card-wp').textContent      = config.wordpressUrl || '—';
  });

  api.onLog(({ msg, type, time }) => appendLog(msg, type, time));
  api.onWatcherStatus(running => setWatcherUI(running));

  // ── Watcher ───────────────────────────────────────────────────────────────
  async function startWatcher() {
    setButtonsBusy(true);
    await api.startWatcher();
    setButtonsBusy(false);
  }

  async function stopWatcher() {
    await api.stopWatcher();
  }

  function setWatcherUI(running) {
    const pill = document.getElementById('status-pill');
    const txt  = document.getElementById('status-text');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');

    pill.className   = 'status-pill ' + (running ? 'running' : 'stopped');
    txt.textContent  = running ? 'Watcher Running' : 'Watcher Stopped';
    btnStart.disabled = running;
    btnStop.disabled  = !running;
  }

  function setButtonsBusy(busy) {
    document.getElementById('btn-start').disabled = busy;
    document.getElementById('btn-pull').disabled  = busy;
    document.getElementById('btn-zip').disabled   = busy;
  }

  // ── Git ───────────────────────────────────────────────────────────────────
  async function gitPull() {
    document.getElementById('btn-pull').disabled = true;
    await api.gitPull();
    document.getElementById('btn-pull').disabled = false;
  }

  // ── ZIP ───────────────────────────────────────────────────────────────────
  async function buildZip() {
    document.getElementById('btn-zip').disabled = true;
    await api.buildZip();
    document.getElementById('btn-zip').disabled = false;
  }

  // ── Log ───────────────────────────────────────────────────────────────────
  function appendLog(msg, type, time) {
    const el = document.getElementById('log');
    if (logEmpty) { el.innerHTML = ''; logEmpty = false; }
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="log-time">${time}</span><span class="log-msg ${type}">${escHtml(msg)}</span>`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  function clearLog() {
    const el = document.getElementById('log');
    el.innerHTML = '<div class="log-empty">Cleared.</div>';
    logEmpty = true;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
